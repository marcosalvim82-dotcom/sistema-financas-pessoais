<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>aguardando</title>
<link rel="stylesheet" href="../css/app.css">
<style>body{overflow:auto;padding:1rem;font-family:var(--mono)}
#r,#r2{padding:.5rem 0;border-bottom:1px solid var(--rule);font-size:.85rem;white-space:pre-wrap}</style>

<body>
<h1 style="font-size:1rem">Teste de fumaça</h1>
<div id="r">aguardando</div>
<div id="r2">aguardando</div>
<div id="app"></div>

<script src="../js/util.js"></script>
<script src="../js/store.js"></script>
<script src="../js/rules.js"></script>
<script src="../js/pdf.js"></script>
<script src="../js/pdftx.js"></script>

<script src="../js/insights.js"></script>
<script src="../js/charts.js"></script>
<script src="../js/xlsx.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/views.js"></script>

<script src="../js/demo.js"></script>

<script>
/* ══════════════════════════════════════════════════════════════════
   Teste de fumaça — roda em navegador headless via ../testar.cmd

   Não usa IndexedDB de propósito: sob tempo virtual o headless não
   avança os callbacks do IndexedDB, e o teste ficaria pendurado.
   O dataset é montado direto em memória.
   ══════════════════════════════════════════════════════════════════ */
(function () {
  var falhas = [];
  var notas = [];
  function exigir(nome, cond) { if (!cond) falhas.push(nome); }

  /* ── Bloco 1: módulos carregaram e funções puras respondem ───── */
  exigir('U', typeof U === 'object');
  exigir('DB', typeof DB === 'object');
  exigir('RULES', typeof RULES === 'object');
  exigir('PARSE', typeof PARSE === 'object');
  exigir('ENGINE', typeof ENGINE === 'object');
  exigir('INSIGHTS', typeof INSIGHTS === 'object');
  exigir('CHARTS', typeof CHARTS === 'object');
  exigir('XLSXOUT', typeof XLSXOUT === 'object');
  exigir('UI', typeof UI === 'object');
  exigir('views1', window.__views1 === true);
  exigir('views2', window.__views2 === true);
  exigir('demo', typeof UI.actions.demo === 'function');
  exigir('9-renderizadores', Object.keys(UI.viewRenderers).length >= 9);
  exigir('GMAIL', typeof GMAIL === 'object');
  exigir('gmail-acao', typeof UI.actions.gmail === 'function');

  /* ── Gmail: consulta e decodificação, sem tocar na rede ──────── */
  try {
    var q = GMAIL.montarConsulta({ meses: 6 });
    exigir('gmail-consulta-anexo', q.indexOf('has:attachment') >= 0);
    exigir('gmail-consulta-periodo', q.indexOf('newer_than:6m') >= 0);
    exigir('gmail-consulta-remetente', q.indexOf('from:nubank.com.br') >= 0);
    exigir('gmail-consulta-assunto', q.indexOf('subject:(fatura)') >= 0);
    exigir('gmail-consulta-lixeira', q.indexOf('-in:trash') >= 0);
    exigir('gmail-sem-credencial', GMAIL.configurado() === false);
    exigir('gmail-desconectado', GMAIL.conectado() === false);
    exigir('gmail-extensoes', RULES.EMAIL_EXTENSIONS.indexOf('ofx') >= 0 &&
      RULES.EMAIL_EXTENSIONS.indexOf('csv') >= 0);
    exigir('gmail-remetentes', RULES.EMAIL_SENDERS.length >= 30);
  } catch (e) { falhas.push('GMAIL-EXCECAO:' + e.message); }

  try {
    exigir('dinheiro', U.money(-123456) === '−R$ 1.234,56');
    exigir('data-br', U.parseDate('05/03/2026') === '2026-03-05');
    exigir('data-ofx', U.parseDate('20260305') === '2026-03-05');
    exigir('valor-br', U.parseMoney('1.234,56') === 123456);
    exigir('valor-negativo', U.parseMoney('-1.234,56') === -123456);
    exigir('valor-debito', U.parseMoney('45,90 D') === -4590);
    exigir('descritor', U.normalizeDescriptor('PG *RESTAURANTE DA MARIA SP') === 'RESTAURANTE DA MARIA');
    exigir('estabelecimento', U.merchantKey(U.merchantSource(
      U.normalizeDescriptor('DEBITO AUTOMATICO ENEL DISTRIBUICAO SP'))) === 'ENEL DISTRIBUICAO');
    exigir('uber-preservado', U.merchantKey(U.normalizeDescriptor('UBER *TRIP')) === 'UBER TRIP');
    var p = ENGINE.detectInstallment('MAGAZINE PARC 03/12');
    exigir('parcela', p && p.no === 3 && p.total === 12);
    exigir('categorias', RULES.buildCategories().length > 100);
    exigir('regras-semeadas', RULES.SEED_RULES.length > 80);
    notas.push('categorias=' + RULES.buildCategories().length);
    notas.push('regras=' + RULES.SEED_RULES.length);
  } catch (e) { falhas.push('puras:' + e.message); }

  /* ── Bloco 2: leitura de OFX e CSV ───────────────────────────── */
  try {
    var ofx = [
      'OFXHEADER:100', 'DATA:OFXSGML', '',
      '<OFX><SIGNONMSGSRSV1><SONRS><FI><ORG>Itau<FID>341</FI></SONRS></SIGNONMSGSRSV1>',
      '<BANKMSGSRSV1><STMTTRNRS><STMTRS><CURDEF>BRL',
      '<BANKACCTFROM><BANKID>341<ACCTID>567890<ACCTTYPE>CHECKING</BANKACCTFROM>',
      '<BANKTRANLIST><DTSTART>20260601<DTEND>20260630',
      '<STMTTRN><TRNTYPE>DEBIT<DTPOSTED>20260603<TRNAMT>-189.90<FITID>A1<MEMO>PG *DROGARIA SAO PAULO</STMTTRN>',
      '<STMTTRN><TRNTYPE>CREDIT<DTPOSTED>20260605<TRNAMT>8500.00<FITID>A2<MEMO>PAGAMENTO DE SALARIO</STMTTRN>',
      '</BANKTRANLIST><LEDGERBAL><BALAMT>7045.30<DTASOF>20260630</LEDGERBAL>',
      '</STMTRS></STMTTRNRS></BANKMSGSRSV1></OFX>'
    ].join('\n');
    var o = PARSE.parseOFX(ofx, 'extrato.ofx');
    exigir('ofx-instituicao', o.institution && o.institution.id === 'itau');
    exigir('ofx-lancamentos', o.statements[0].records.length === 2);
    exigir('ofx-saldo', o.statements[0].balanceCents === 704530);
    exigir('ofx-valor', o.statements[0].records[0].amountCents === -18990);

    var csv = 'Data;Histórico;Valor;Saldo\r\n' +
      '01/06/2026;COMPRA CARTAO DEBITO CARREFOUR;-235,49;4.512,30\r\n' +
      '02/06/2026;PIX ENVIADO JOAO M SILVA;-150,00;4.362,30\r\n';
    var c = PARSE.parseCSV(csv, 'extrato.csv');
    exigir('csv-lancamentos', c.statements[0].records.length === 2);
    exigir('csv-valor', c.statements[0].records[0].amountCents === -23549);
    exigir('csv-saldo', c.statements[0].balanceCents === 436230);
  } catch (e) { falhas.push('leitura:' + e.message); }

  /* ── CSV do Banco Inter: preâmbulo e duas colunas de descrição ──
     Layout real do Inter, com dados inventados. O Histórico traz o
     tipo e a Descrição traz o estabelecimento; usar só a primeira faz
     todo lançamento virar "Compra no débito", sem comerciante algum. */
  try {
    var inter = [
      ' Extrato Conta Corrente ',
      'Conta ;123456789',
      'Período ;30/07/2026 a 30/08/2026',
      'Saldo ;1.215,30',
      '',
      'Data Lançamento;Histórico;Descrição;Valor;Saldo',
      '29/08/2026;Pix enviado ;Fulano De Tal Silva;-37,00;1.215,30',
      '28/08/2026;Compra no débito;Padaria Central       Belo Horizont Bra;-22,00;1.252,30',
      '27/08/2026;Compra no débito;;-5,80;1.274,30',
      '26/08/2026;Pix recebido;Empresa Exemplo Ltda;225,00;1.280,10',
      '24/08/2026;Pagamento efetuado;Pagamento Fatura - NOME DO TITULAR;-835,27;1.055,10',
      '19/08/2026;Transferência enviada;NOME DO TITULAR;-800,00;255,10'
    ].join('\r\n');

    var ci = PARSE.parseCSV(inter, 'Extrato-30-07-2026-a-30-08-2026-CSV.csv');
    var ri = ci.statements[0] ? ci.statements[0].records : [];
    exigir('inter-qtd', ri.length === 6);
    exigir('inter-ignora-preambulo',
      !ri.some(function (r) { return /Conta|Per[íi]odo/.test(r.descriptor); }));

    // O nome do estabelecimento não pode se perder.
    var pix = ri.find(function (r) { return /Fulano/.test(r.descriptor); });
    exigir('inter-mantem-contraparte', !!pix && pix.amountCents === -3700);

    var pad = ri.find(function (r) { return /Padaria/.test(r.descriptor); });
    exigir('inter-mantem-estabelecimento', !!pad);

    // Linha sem Descrição ainda precisa virar lançamento.
    var semDesc = ri.find(function (r) { return r.amountCents === -580; });
    exigir('inter-linha-sem-descricao', !!semDesc && /d[ée]bito/i.test(semDesc.descriptor));

    // O comerciante precisa sair limpo, sem o tipo colado na frente.
    var chavePad = U.merchantKey(U.merchantSource(U.normalizeDescriptor(pad ? pad.descriptor : '')));
    exigir('inter-comerciante-limpo', chavePad.indexOf('COMPRA') < 0 && /PADARIA/.test(chavePad));

    var chavePix = U.merchantKey(U.merchantSource(U.normalizeDescriptor(pix ? pix.descriptor : '')));
    exigir('inter-pix-contraparte', /FULANO/.test(chavePix));

    // Saldo: as linhas vêm da mais nova para a mais antiga, então o
    // saldo válido é o da data mais recente, não o da última linha.
    exigir('inter-saldo-mais-recente', ci.statements[0].balanceCents === 121530);
    exigir('inter-instituicao', ci.institution && ci.institution.id === 'inter');
  } catch (e) { falhas.push('inter:' + e.message); }

  /* ── Bloco 3: geração de XLSX ────────────────────────────────── */
  try {
    var blob = XLSXOUT.build([{ name: 'T', rows: [['a', 'b'], ['x', 1.5]] }]);
    exigir('xlsx', blob && blob.size > 1000);
  } catch (e) { falhas.push('xlsx:' + e.message); }

  document.getElementById('r').textContent =
    (falhas.length ? 'FALHOU [' + falhas.join(' | ') + ']' : 'OK') +
    ' :: ' + notas.join(' ');

  /* ── Bloco 4: dataset em memória e as 9 telas ────────────────── */
  var falhasTela = [];
  var resumoTela = '';
  try {
    DB.data = DB.emptyDataset();
    DB.ready = true;
    ENGINE.seed();

    var hoje = U.today();
    DB.data.accounts.push({
      id: 'acc1', institutionId: 'nubank', name: 'Conta teste', type: 'checking',
      masked: '1234', currency: 'BRL', balanceCents: 500000, balanceDate: hoje,
      status: 'active', includeInNetWorth: true, color: '#820AD1'
    });
    DB.data.cards.push({
      id: 'card1', institutionId: 'nubank', name: 'Cartão teste', masked: '4471',
      limitCents: 1000000, closingDay: 2, dueDay: 10, paymentAccountId: 'acc1',
      status: 'active', color: '#820AD1', cycleLocked: true
    });

    var amostras = [
      ['PAGAMENTO DE SALARIO EMPRESA', 850000, 'acc1', 5],
      ['DEBITO AUTOMATICO ENEL DISTRIBUICAO SP', -18900, 'acc1', 12],
      ['PAGAMENTO BOLETO CONDOMINIO EDIFICIO', -74500, 'acc1', 10],
      ['APLICACAO CDB LIQUIDEZ DIARIA', -150000, 'acc1', 6],
      ['TARIFA CESTA DE SERVICOS', -3490, 'acc1', 2],
      ['PAGAMENTO FATURA CARTAO DE CREDITO', -230000, 'acc1', 10],
      ['IFD*IFOOD', -6480, 'card1', 14],
      ['CARREFOUR HIPER', -23549, 'card1', 8],
      ['UBER *TRIP', -2340, 'card1', 16],
      ['NETFLIX.COM', -5990, 'card1', 14],
      ['MAGAZINE LUIZA NOTEBOOK PARC 03/12', -41200, 'card1', 20],
      ['DROGARIA SAO PAULO', -18990, 'card1', 11]
    ];
    for (var m = 5; m >= 0; m--) {
      var ref = U.addMonths(hoje, -m);
      var y = +ref.split('-')[0], mm = +ref.split('-')[1];
      for (var i = 0; i < amostras.length; i++) {
        var a = amostras[i];
        var data = U.clampDay(y, mm, a[3]);
        if (data > hoje) continue;
        var norm = U.normalizeDescriptor(a[0]);
        var src = U.merchantSource(norm);
        var tx = {
          id: 'tx' + m + '-' + i,
          accountId: a[2] === 'acc1' ? 'acc1' : null,
          cardId: a[2] === 'card1' ? 'card1' : null,
          date: data, cashDate: data, amountCents: a[1],
          descriptorRaw: a[0], descriptorNorm: norm,
          merchantKey: U.merchantKey(src), merchantName: U.titleCase(src),
          method: RULES.detectMethod(norm), status: 'posted',
          isTransfer: false, tags: [], fingerprint: 'fp' + m + i,
          importId: 'imp1', createdAt: new Date().toISOString()
        };
        var parc = ENGINE.detectInstallment(a[0]);
        if (parc) { tx.installmentNo = parc.no; tx.installmentTotal = parc.total; }
        ENGINE.applyClassification(tx, ENGINE.classify(tx, {}));
        if (parc) ENGINE.linkInstallment(tx);
        DB.data.transactions.push(tx);
      }
    }
    DB.data.goals.push({ id: 'g1', type: 'emergency_fund', name: 'Reserva', targetCents: 3000000, targetDate: '' });
    DB.data.investPositions.push({
      id: 'p1', name: 'CDB', assetClass: 'renda-fixa',
      investedCents: 1000000, currentCents: 1120000, createdAt: hoje, updatedAt: hoje
    });

    ENGINE.recomputeCardCycles();
    ENGINE.linkTransfers();
    ENGINE.detectRecurrences();
    UI.applyTheme();
    UI.render();

    var telas = ['painel', 'revisar', 'transacoes', 'cartoes', 'calendario',
      'metas', 'investimentos', 'relatorios', 'ajustes'];
    for (var t = 0; t < telas.length; t++) {
      try {
        UI.state.view = telas[t];
        UI.render();
        if (document.querySelector('#viewRoot').innerHTML.indexOf('Algo quebrou') > -1) {
          falhasTela.push(telas[t]);
        }
      } catch (e) { falhasTela.push(telas[t] + ':' + e.message); }
    }

    // Gmail: o cartão aparece em Ajustes e, sem https, avisa em vez de
    // tentar autenticar (aqui o harness roda em file://).
    UI.state.view = 'ajustes';
    UI.render();
    var htmlAjustes = document.querySelector('#viewRoot').innerHTML;
    if (htmlAjustes.indexOf('>Gmail<') < 0) falhasTela.push('ajustes-sem-cartao-gmail');
    if (htmlAjustes.indexOf('Indispon') < 0) falhasTela.push('ajustes-nao-avisa-file-local');
    if (!document.querySelector('nav [data-act=gmail]')) falhasTela.push('menu-sem-botao-gmail');

    UI.actions.gmail();
    var modal = document.querySelector('.scrim .modal');
    if (!modal) falhasTela.push('gmail-nao-abriu-aviso');
    else if (modal.innerHTML.indexOf('https') < 0) falhasTela.push('gmail-aviso-sem-explicacao');
    UI.closeModal();

    // No celular o menu lateral some; o "Mais" precisa dar acesso a
    // tudo que ficou de fora, senão metade do app fica inalcançável.
    UI.state.view = 'painel';
    UI.render();
    if (!document.querySelector('.mobilebar [data-act=mais]')) falhasTela.push('mobile-sem-botao-mais');
    UI.actions.mais();
    var sheet = document.querySelector('.scrim .modal');
    if (!sheet) falhasTela.push('mais-nao-abriu');
    else {
      ['calendario', 'metas', 'investimentos', 'relatorios', 'ajustes'].forEach(function (v) {
        if (!sheet.querySelector('[data-nav=' + v + ']')) falhasTela.push('mais-sem-' + v);
      });
      ['import', 'gmail', 'backup', 'theme'].forEach(function (a) {
        if (!sheet.querySelector('[data-act=' + a + ']')) falhasTela.push('mais-sem-acao-' + a);
      });
    }
    UI.closeModal();

    // E o Gmail precisa estar alcançável já no painel, sem caçar em menu.
    UI.render();
    if (!document.querySelector('#viewRoot [data-act=gmail]')) falhasTela.push('painel-sem-botao-gmail');

    var total = DB.data.transactions.length;
    var fila = ENGINE.reviewQueue().length;
    var cartao = ENGINE.cardSummary(DB.data.cards[0]);
    resumoTela = 'telas=9 lancamentos=' + total +
      ' auto=' + ((total - fila) / total * 100).toFixed(0) + '%' +
      ' recorrencias=' + DB.data.recurrences.length +
      ' parcelamentos=' + DB.data.installmentPlans.length +
      ' faturaAberta=' + U.money(cartao.openCents) +
      ' limiteDisp=' + U.money(cartao.availableCents) +
      ' insights=' + INSIGHTS.all().length;

    // Nenhuma correção manual pode ter sido perdida (regra inviolável 2).
    var manuais = DB.data.transactions.filter(function (x) { return x.categorySource === 'user'; });
    ENGINE.reclassifyAll(false);
    var manuaisDepois = DB.data.transactions.filter(function (x) { return x.categorySource === 'user'; });
    if (manuais.length !== manuaisDepois.length) falhasTela.push('reclassify-apagou-manual');
  } catch (e) {
    falhasTela.push('boot:' + e.message);
  }

  var linha2 = (falhasTela.length ? 'FALHOU [' + falhasTela.join(' | ') + ']' : 'OK') +
    ' :: ' + resumoTela;
  document.getElementById('r2').textContent = linha2;

  document.title = document.getElementById('r').textContent + ' /// ' + linha2;
  window.__linha1 = document.getElementById('r').textContent;
  window.__linha2 = linha2;
})();
</script>

<script>
/* ══════════ Leitor de PDF: monta PDFs sintéticos e confere ══════════ */
(function () {
  var falhas = [];
  var checados = 0;
  // Conta as verificações: um teste que morre no meio e passa em
  // silêncio é pior que teste nenhum, porque dá falsa segurança.
  function exigir(nome, cond) { checados++; if (!cond) falhas.push(nome); }

  function escapar(s) {
    return String(s).replace(/([\\()])/g, '\\$1');
  }

  // Monta um PDF válido a partir de linhas posicionadas.
  // linhas: [{ y, partes: [{ x, texto }] }]
  function montarPDF(linhas, opts) {
    opts = opts || {};
    var conteudo = 'BT\n';
    linhas.forEach(function (L) {
      L.partes.forEach(function (p) {
        conteudo += '/F1 10 Tf\n';
        conteudo += '1 0 0 1 ' + p.x + ' ' + L.y + ' Tm\n';
        if (opts.hex) {
          var hex = '';
          for (var i = 0; i < p.texto.length; i++) {
            hex += p.texto.charCodeAt(i).toString(16).padStart(4, '0');
          }
          conteudo += '<' + hex + '> Tj\n';
        } else {
          conteudo += '(' + escapar(p.texto) + ') Tj\n';
        }
      });
    });
    conteudo += 'ET\n';
    return { conteudo: conteudo, opts: opts };
  }

  function bytesDe(s) {
    var b = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 0xFF;
    return b;
  }

  async function comprimir(str) {
    var cs = new CompressionStream('deflate');
    var stream = new Blob([bytesDe(str)]).stream().pipeThrough(cs);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function gerarArquivo(spec) {
    var conteudo = spec.conteudo;
    var corpoStream, filtro = '';
    if (spec.opts.comprimido) {
      var z = await comprimir(conteudo);
      corpoStream = '';
      for (var i = 0; i < z.length; i++) corpoStream += String.fromCharCode(z[i]);
      filtro = ' /Filter /FlateDecode';
    } else {
      corpoStream = conteudo;
    }

    var fonte;
    if (spec.opts.hex) {
      // Type0 com ToUnicode: cada código de 2 bytes vira um caractere.
      var mapa = '';
      var vistos = {};
      (spec.opts.caracteres || '').split('').forEach(function (ch) {
        if (vistos[ch]) return;
        vistos[ch] = 1;
        var c = ch.charCodeAt(0).toString(16).padStart(4, '0');
        mapa += '<' + c + '> <' + c + '>\n';
      });
      var cmap = '/CIDInit /ProcSet findresource begin\n12 dict begin\nbegincmap\n' +
        '1 begincodespacerange\n<0000> <FFFF>\nendcodespacerange\n' +
        (Object.keys(vistos).length) + ' beginbfchar\n' + mapa + 'endbfchar\n' +
        'endcmap\nend\nend\n';
      fonte =
        '5 0 obj\n<< /Type /Font /Subtype /Type0 /BaseFont /Teste /ToUnicode 6 0 R >>\nendobj\n' +
        '6 0 obj\n<< /Length ' + cmap.length + ' >>\nstream\n' + cmap + '\nendstream\nendobj\n';
    } else {
      fonte = '5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica ' +
        '/Encoding /WinAnsiEncoding >>\nendobj\n';
    }

    var pdf =
      '%PDF-1.4\n' +
      '1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n' +
      '2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n' +
      '3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] ' +
      '/Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>\nendobj\n' +
      '4 0 obj\n<< /Length ' + corpoStream.length + filtro + ' >>\nstream\n' +
      corpoStream + '\nendstream\nendobj\n' +
      fonte +
      (spec.opts.cifrado ? '9 0 obj\n<< /Filter /Standard /V 2 /R 3 >>\nendobj\ntrailer\n<< /Root 1 0 R /Encrypt 9 0 R >>\n'
        : 'trailer\n<< /Root 1 0 R >>\n') +
      '%%EOF';

    return bytesDe(pdf).buffer;
  }

  // Fatura de cartão fictícia, no formato que os emissores usam.
  var LINHAS_FATURA = [
    { y: 780, partes: [{ x: 40, texto: 'FATURA DO CARTAO DE CREDITO' }] },
    { y: 760, partes: [{ x: 40, texto: 'Vencimento 10/08/2026' }, { x: 300, texto: 'Limite total 12.000,00' }] },
    { y: 730, partes: [{ x: 40, texto: 'Data' }, { x: 110, texto: 'Descricao' }, { x: 480, texto: 'Valor' }] },
    { y: 710, partes: [{ x: 40, texto: '12/07' }, { x: 110, texto: 'IFD*IFOOD' }, { x: 480, texto: '64,80' }] },
    { y: 695, partes: [{ x: 40, texto: '14/07' }, { x: 110, texto: 'POSTO IPIRANGA' }, { x: 480, texto: '287,40' }] },
    { y: 680, partes: [{ x: 40, texto: '15/07' }, { x: 110, texto: 'MAGAZINE LUIZA PARC 03/12' }, { x: 480, texto: '412,00' }] },
    { y: 665, partes: [{ x: 40, texto: '18/07' }, { x: 110, texto: 'DROGARIA SAO PAULO' }, { x: 480, texto: '1.189,90' }] },
    { y: 640, partes: [{ x: 40, texto: 'Total da fatura' }, { x: 480, texto: '1.954,10' }] },
    { y: 600, partes: [{ x: 40, texto: 'Central de atendimento 0800 123 4567' }] }
  ];

  async function rodar() {
    try {
      exigir('pdf-modulo', typeof PDF !== 'undefined' && typeof PDFTX !== 'undefined');

      // 1 · PDF simples, sem compressão
      var buf1 = await gerarArquivo(montarPDF(LINHAS_FATURA, {}));
      var r1 = await PDFTX.parse(buf1, 'fatura-teste.pdf');
      var recs = r1.statements[0].records;
      exigir('pdf-simples-qtd', recs.length === 4);
      exigir('pdf-simples-cartao', r1.statements[0].kind === 'card');
      exigir('pdf-simples-sinal', recs.every(function (r) { return r.amountCents < 0; }));

      var ifood = recs.find(function (r) { return /IFOOD/.test(r.descriptor); });
      exigir('pdf-simples-ifood', !!ifood && ifood.amountCents === -6480);
      exigir('pdf-simples-data', !!ifood && ifood.date === '2026-07-12');

      var milhar = recs.find(function (r) { return /DROGARIA/.test(r.descriptor); });
      exigir('pdf-milhar', !!milhar && milhar.amountCents === -118990);

      // Cabeçalho, total e rodapé não podem virar lançamento.
      exigir('pdf-ignora-total', !recs.some(function (r) { return /Total/i.test(r.descriptor); }));
      exigir('pdf-limite', r1.statements[0].creditLimitCents === 1200000);
      exigir('pdf-vencimento', r1.statements[0].dueDate === '2026-08-10');

      // 2 · Mesmo PDF, agora com stream comprimido
      var buf2 = await gerarArquivo(montarPDF(LINHAS_FATURA, { comprimido: true }));
      var r2 = await PDFTX.parse(buf2, 'fatura-comprimida.pdf');
      exigir('pdf-comprimido', r2.statements[0].records.length === 4);

      // 3 · Fonte de subconjunto com ToUnicode (o caso que embaralha texto)
      var todosChars = LINHAS_FATURA.map(function (L) {
        return L.partes.map(function (p) { return p.texto; }).join('');
      }).join('');
      var buf3 = await gerarArquivo(montarPDF(LINHAS_FATURA, { hex: true, caracteres: todosChars }));
      var r3 = await PDFTX.parse(buf3, 'fatura-fonte.pdf');
      exigir('pdf-tounicode', r3.statements[0].records.length === 4);
      var ifood3 = r3.statements[0].records.find(function (r) { return /IFOOD/.test(r.descriptor); });
      exigir('pdf-tounicode-texto', !!ifood3);

      // 4 · PDF protegido precisa ser detectado, não falhar em silêncio
      var buf4 = await gerarArquivo(montarPDF(LINHAS_FATURA, { cifrado: true }));
      var erro4 = null;
      try { await PDFTX.parse(buf4, 'protegido.pdf'); } catch (e) { erro4 = e; }
      exigir('pdf-protegido', erro4 && erro4.codigo === 'PDF_PROTEGIDO');

      // 5 · O importador precisa aceitar PDF de ponta a ponta
      var arquivo = new File([buf1], 'fatura-teste.pdf', { type: 'application/pdf' });
      var viaParse = await PARSE.parseFile(arquivo);
      exigir('pdf-via-parsefile', viaParse.format === 'pdf' &&
        viaParse.statements.length === 1 &&
        viaParse.statements[0].records.length === 4);

      // 6 · Parcela reconhecida dentro do PDF
      var parcela = ENGINE.detectInstallment('MAGAZINE LUIZA PARC 03/12');
      exigir('pdf-parcela', parcela && parcela.no === 3 && parcela.total === 12);

      // 7 · Extrato COM COLUNA DE SALDO. O valor certo é o penúltimo
      //     número; pegar o último importaria o saldo como se fosse a
      //     transação, e o erro passa despercebido.
      var EXTRATO_SALDO = [
        { y: 800, partes: [{ x: 40, texto: 'EXTRATO DE CONTA CORRENTE' }] },
        { y: 770, partes: [{ x: 40, texto: 'Data' }, { x: 110, texto: 'Historico' },
                           { x: 400, texto: 'Valor' }, { x: 490, texto: 'Saldo' }] },
        { y: 750, partes: [{ x: 40, texto: '01/07/2026' }, { x: 110, texto: 'SALDO ANTERIOR' },
                           { x: 490, texto: '5.000,00' }] },
        { y: 735, partes: [{ x: 40, texto: '02/07/2026' }, { x: 110, texto: 'COMPRA CARREFOUR' },
                           { x: 400, texto: '-235,49' }, { x: 490, texto: '4.764,51' }] },
        { y: 720, partes: [{ x: 40, texto: '03/07/2026' }, { x: 110, texto: 'PIX ENVIADO JOAO' },
                           { x: 400, texto: '-150,00' }, { x: 490, texto: '4.614,51' }] },
        { y: 705, partes: [{ x: 40, texto: '05/07/2026' }, { x: 110, texto: 'PAGAMENTO DE SALARIO' },
                           { x: 400, texto: '8.500,00' }, { x: 490, texto: '13.114,51' }] }
      ];
      var bufS = await gerarArquivo(montarPDF(EXTRATO_SALDO, {}));
      var rS = await PDFTX.parse(bufS, 'extrato-conta.pdf');
      var recS = rS.statements[0].records;
      exigir('saldo-qtd', recS.length === 3);
      exigir('saldo-conta-nao-cartao', rS.statements[0].kind === 'account');
      var carref = recS.find(function (r) { return /CARREFOUR/.test(r.descriptor); });
      exigir('saldo-valor-certo', !!carref && carref.amountCents === -23549);
      var salario = recS.find(function (r) { return /SALARIO/.test(r.descriptor); });
      exigir('saldo-entrada-certa', !!salario && salario.amountCents === 850000);
      exigir('saldo-ignora-anterior',
        !recS.some(function (r) { return /SALDO ANTERIOR/i.test(r.descriptor); }));

      // 8 · Data escrita uma vez como cabeçalho do dia, transações
      //     listadas abaixo sem repetir a data. Formato comum em app.
      var EXTRATO_AGRUPADO = [
        { y: 800, partes: [{ x: 40, texto: 'MOVIMENTACAO' }] },
        { y: 770, partes: [{ x: 40, texto: '14/07/2026' }] },
        { y: 752, partes: [{ x: 60, texto: 'MERCADO SAO JORGE' }, { x: 480, texto: '89,90' }] },
        { y: 736, partes: [{ x: 60, texto: 'UBER *TRIP' }, { x: 480, texto: '23,40' }] },
        { y: 706, partes: [{ x: 40, texto: '15/07/2026' }] },
        { y: 688, partes: [{ x: 60, texto: 'NETFLIX.COM' }, { x: 480, texto: '59,90' }] }
      ];
      var bufG = await gerarArquivo(montarPDF(EXTRATO_AGRUPADO, {}));
      var rG = await PDFTX.parse(bufG, 'movimentacao.pdf');
      var recG = rG.statements[0].records;
      exigir('agrupado-qtd', recG.length === 3);
      exigir('agrupado-herda-data',
        recG.filter(function (r) { return r.date === '2026-07-14'; }).length === 2);
      exigir('agrupado-troca-data',
        recG.filter(function (r) { return r.date === '2026-07-15'; }).length === 1);

      // 9 · Descrição que quebra em duas linhas
      var EXTRATO_QUEBRA = [
        { y: 800, partes: [{ x: 40, texto: 'LANCAMENTOS DO PERIODO' }] },
        { y: 770, partes: [{ x: 40, texto: '20/07/2026' }, { x: 110, texto: 'PAGAMENTO CONVENIO' },
                           { x: 480, texto: '1.240,00' }] },
        { y: 756, partes: [{ x: 110, texto: 'PREFEITURA MUNICIPAL IPTU' }] },
        { y: 730, partes: [{ x: 40, texto: '21/07/2026' }, { x: 110, texto: 'FARMACIA' },
                           { x: 480, texto: '45,00' }] }
      ];
      var bufQ = await gerarArquivo(montarPDF(EXTRATO_QUEBRA, {}));
      var rQ = await PDFTX.parse(bufQ, 'lancamentos.pdf');
      var recQ = rQ.statements[0].records;
      exigir('quebra-qtd', recQ.length === 2);
      exigir('quebra-juntou-descricao',
        !!recQ[0] && /CONVENIO/.test(recQ[0].descriptor) && /IPTU/.test(recQ[0].descriptor));

      // 10-A · Extrato de conta com valores SEM SINAL e coluna de saldo.
      //        Muitos bancos não escrevem o menos: a saída se reconhece
      //        porque o saldo cai. Sem isso, gasto entra como receita e
      //        o painel inteiro passa a mentir.
      var SEM_SINAL = [
        { y: 800, partes: [{ x: 40, texto: 'EXTRATO DE CONTA CORRENTE' }] },
        { y: 775, partes: [{ x: 40, texto: 'Data' }, { x: 110, texto: 'Historico' },
                           { x: 400, texto: 'Valor' }, { x: 490, texto: 'Saldo' }] },
        { y: 755, partes: [{ x: 40, texto: '01/07/2026' }, { x: 110, texto: 'SALDO ANTERIOR' },
                           { x: 490, texto: '5.000,00' }] },
        { y: 738, partes: [{ x: 40, texto: '02/07/2026' }, { x: 110, texto: 'COMPRA CARREFOUR' },
                           { x: 400, texto: '235,49' }, { x: 490, texto: '4.764,51' }] },
        { y: 721, partes: [{ x: 40, texto: '03/07/2026' }, { x: 110, texto: 'PIX ENVIADO JOAO' },
                           { x: 400, texto: '150,00' }, { x: 490, texto: '4.614,51' }] },
        { y: 704, partes: [{ x: 40, texto: '05/07/2026' }, { x: 110, texto: 'PAGAMENTO SALARIO' },
                           { x: 400, texto: '8.500,00' }, { x: 490, texto: '13.114,51' }] }
      ];
      var bufN = await gerarArquivo(montarPDF(SEM_SINAL, {}));
      var rN = await PDFTX.parse(bufN, 'extrato-sem-sinal.pdf');
      var recN = rN.statements[0].records;
      exigir('semsinal-qtd', recN.length === 3);
      var cN = recN.find(function (r) { return /CARREFOUR/.test(r.descriptor); });
      exigir('semsinal-compra-negativa', !!cN && cN.amountCents === -23549);
      var pN = recN.find(function (r) { return /PIX ENVIADO/.test(r.descriptor); });
      exigir('semsinal-pix-negativo', !!pN && pN.amountCents === -15000);
      var sN = recN.find(function (r) { return /SALARIO/.test(r.descriptor); });
      exigir('semsinal-salario-positivo', !!sN && sN.amountCents === 850000);

      // 10-B · Sem coluna de saldo e sem sinal: resta a descrição.
      var SEM_SALDO = [
        { y: 800, partes: [{ x: 40, texto: 'MOVIMENTACAO DA CONTA' }] },
        { y: 770, partes: [{ x: 40, texto: '10/07/2026' }, { x: 110, texto: 'SAQUE BANCO24HORAS' },
                           { x: 470, texto: '200,00' }] },
        { y: 752, partes: [{ x: 40, texto: '11/07/2026' }, { x: 110, texto: 'DEPOSITO EM DINHEIRO' },
                           { x: 470, texto: '500,00' }] },
        { y: 734, partes: [{ x: 40, texto: '12/07/2026' }, { x: 110, texto: 'COMPRA CARTAO MERCADO' },
                           { x: 470, texto: '89,90' }] }
      ];
      var bufSS = await gerarArquivo(montarPDF(SEM_SALDO, {}));
      var rSS = await PDFTX.parse(bufSS, 'movimentacao-conta.pdf');
      var recSS = rSS.statements[0].records;
      exigir('semsaldo-saque-negativo',
        !!recSS[0] && recSS[0].amountCents === -20000);
      exigir('semsaldo-deposito-positivo',
        !!recSS[1] && recSS[1].amountCents === 50000);
      exigir('semsaldo-compra-negativa',
        !!recSS[2] && recSS[2].amountCents === -8990);

      // 11 · Sinal vindo do sufixo D/C, sem menos no número
      var EXTRATO_DC = [
        { y: 800, partes: [{ x: 40, texto: 'EXTRATO' }] },
        { y: 770, partes: [{ x: 40, texto: '10/07/2026' }, { x: 110, texto: 'TARIFA MENSALIDADE' },
                           { x: 460, texto: '34,90 D' }] },
        { y: 750, partes: [{ x: 40, texto: '11/07/2026' }, { x: 110, texto: 'DEPOSITO EM DINHEIRO' },
                           { x: 460, texto: '500,00 C' }] }
      ];
      var bufD = await gerarArquivo(montarPDF(EXTRATO_DC, {}));
      var rD = await PDFTX.parse(bufD, 'extrato-dc.pdf');
      var recD = rD.statements[0].records;
      exigir('dc-qtd', recD.length === 2);
      exigir('dc-debito-negativo',
        !!recD[0] && recD[0].amountCents === -3490);
      exigir('dc-credito-positivo',
        !!recD[1] && recD[1].amountCents === 50000);

    } catch (e) {
      falhas.push('excecao:' + (e && e.message ? e.message.slice(0, 60) : e));
    }

    // Se o bloco morreu antes do fim, o número de verificações cai —
    // e isso vira falha explícita em vez de um "OK" enganoso.
    var ESPERADO = 29;
    if (checados < ESPERADO) {
      falhas.push('so-rodou-' + checados + '-de-' + ESPERADO + '-verificacoes');
    }
    /* ══════════ Acessibilidade das telas renderizadas ══════════ */
    // Uma regressão de acessibilidade não aparece na tela: some em
    // silêncio e só quem depende dela descobre. Por isso vira teste.
    var a11y = [];
    try {
      var app = document.getElementById('app');

      UI.state.view = 'painel';
      UI.render();

      if (!app.querySelector('.skip-link')) a11y.push('sem-link-pular-conteudo');
      if (!document.getElementById('anuncio')) a11y.push('sem-regiao-de-anuncio');

      var nav = app.querySelector('nav.side');
      if (!nav || !nav.getAttribute('aria-label')) a11y.push('nav-sem-nome');

      var main = app.querySelector('main');
      if (!main || main.tabIndex !== -1) a11y.push('main-nao-focavel');

      if (!app.querySelector('[aria-current="page"]')) a11y.push('sem-item-de-menu-atual');

      // Todo gráfico precisa de nome acessível e de saída em tabela.
      var svgs = app.querySelectorAll('svg.chart:not([aria-hidden])');
      for (var i = 0; i < svgs.length; i++) {
        if (!svgs[i].getAttribute('aria-labelledby')) { a11y.push('grafico-sem-nome'); break; }
      }
      if (svgs.length && !app.querySelector('details.chart-dados')) {
        a11y.push('grafico-sem-tabela-alternativa');
      }

      // Nenhum controle pode ficar sem rótulo legível.
      var semNome = 0;
      app.querySelectorAll('button,input,select').forEach(function (el) {
        var temTexto = (el.textContent || '').trim().length > 0;
        var temAria = el.getAttribute('aria-label') || el.getAttribute('aria-labelledby');
        var temLabelPai = el.closest('label');
        if (!temTexto && !temAria && !temLabelPai) semNome++;
      });
      if (semNome) a11y.push('controles-sem-rotulo:' + semNome);

      // A tela de lançamentos é a de maior tráfego: idem.
      UI.state.view = 'transacoes';
      UI.render();
      var caixas = app.querySelectorAll('input[type=checkbox][data-selecttx]');
      if (caixas.length && !caixas[0].getAttribute('aria-label')) {
        a11y.push('selecao-sem-rotulo');
      }
      var acoes = app.querySelectorAll('[data-act=editcat]');
      if (acoes.length && !acoes[0].getAttribute('aria-label')) {
        a11y.push('acao-de-linha-sem-contexto');
      }

      UI.state.view = 'painel';
      UI.render();
    } catch (e) {
      a11y.push('a11y-excecao:' + (e && e.message ? e.message.slice(0, 40) : e));
    }
    falhas = falhas.concat(a11y);

    var linha3 = (falhas.length ? 'FALHOU [' + falhas.join(' | ') + ']' : 'OK') +
      ' :: pdf ' + checados + ' verificacoes · acessibilidade ok';
    var el = document.createElement('pre');
    el.id = 'r3';
    el.textContent = linha3;
    document.body.appendChild(el);
    document.title = window.__linha1 + ' /// ' + window.__linha2 + ' /// ' + linha3;
  }

  rodar();
})();
</script>
</body>
</html>
